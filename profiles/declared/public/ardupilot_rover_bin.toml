profile_id = "ardupilot_rover_bin"
version = "2026-08-21.1"
family = "ugv"
source_role = "fc"
format = "ardupilot_dataflash_bin"
extensions = ["bin"]
default_clock_basis = "boot_relative"
channels = ["onboard", "rc", "link_stats", "gps_ekf", "event"]

[fields]
time = "TimeUS"
status = ["MODE.Mode", "MODE.Rsn", "MSG.Message", "ERR.Subsys", "ERR.ECode", "EV.Id"]
link = ["RAD.RSSI", "RAD.RemRSSI", "RAD.Noise", "RAD.RxErrors", "RSSI.RXRSSI", "RSSI.RXLQ"]
battery = ["BAT.Volt", "BAT.RemPct"]
gps = ["GPS.Status", "GPS.NSats", "GPS.HDop", "GPA.HAcc", "UBX1.jamInd", "XKF4.SS", "XKF4.SP", "XKF4.TS", "XKF4.OFN"]
health = ["POWR.Vcc", "RCIN.C1", "RCIN.C3"]

[[expectations]]
id = "onboard_record_1hz"
channel = "onboard"
cadence_ms = 1000
grace_k = 3

[[expectations]]
id = "gps_2hz"
channel = "gps_ekf"
cadence_ms = 500
grace_k = 6

[[expectations]]
id = "rcin_2hz"
channel = "rc"
cadence_ms = 500
grace_k = 6
frozen_ms = 2000

[[expectations]]
id = "rad_1hz"
channel = "link_stats"
cadence_ms = 1000
grace_k = 5
