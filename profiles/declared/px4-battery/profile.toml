profile_id = "px4_battery_finite_v1"
version = "1"
family = "unknown"
source_role = "recorded_export"
format = "telemetry_csv_us"
extensions = ["csv"]
default_clock_basis = "boot_relative"
channels = ["onboard"]

[fields]
time = "timestamp"

[units]
battery_time_remaining_s = "s_reported_capacity_current_remaining_time_estimate_not_safe_operating_time"
battery_time_remaining_basis = "REPORTED_estimate_or_UNAVAILABLE_NAN_no_end_time_or_physical_guarantee"
timestamp = "us_since_boot"
id = "recorded_battery_id_not_authenticated_identity"
voltage_v = "V_or_zero_unavailable"
current_a = "A_or_minus_one_unavailable"
discharged_mah = "mAh_or_minus_one_unavailable"
remaining = "fraction_or_minus_one_unavailable"
battery_voltage_v = "V"
battery_current_a = "A"
battery_consumed_ah = "Ah"
battery_consumed_j = "J"
battery_power_w = "W_calculated_voltage_times_current"
battery_remaining_fraction = "fraction_estimated_or_blank_unavailable"
