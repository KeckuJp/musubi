[package]
name = "musubi-reference-fanout"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Offline reference observation fanout to CoT, NVG and CSV files with explicit loss accounting."
autobins = false

[lints]
workspace = true

[[bin]]
name = "musubi-reference-fanout"
path = "src/bin/fanout.rs"

[dependencies]
musubi-types = { path = "../types" }
musubi-core = { path = "../core" }
musubi-northbound = { path = "../northbound" }
musubi-reference-types = { path = "../reference-types" }
musubi-reference-readers = { path = "../reference-readers" }
musubi-reference-pipeline = { path = "../reference-pipeline" }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
musubi-reference-scenario = { path = "../reference-scenario" }
