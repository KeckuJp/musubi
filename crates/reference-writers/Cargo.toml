[package]
name = "musubi-reference-writers"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Offline reference writers for saved observations and synthetic analysis."

[lints]
workspace = true

[lib]
name = "musubi_reference_writers"
path = "src/lib.rs"

[[bin]]
name = "musubi-reference-synth"
path = "src/main.rs"

[dependencies]
musubi-reference-types = { path = "../reference-types" }
musubi-reference-scenario = { path = "../reference-scenario" }

clap = { version = "4", features = ["derive"] }
