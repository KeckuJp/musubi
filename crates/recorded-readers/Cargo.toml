[package]
name = "musubi-recorded-readers"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Offline saved-record readers with source-clock and field preservation. No transport or diagnosis."
[lints]
workspace = true
[dependencies]
musubi-types = { path = "../types" }
musubi-decoded-csv = { path = "../decoded-csv" }
musubi-jsonl-log = { path = "../jsonl-log" }
musubi-miniseed2 = { path = "../miniseed2" }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = { version = "0.10", default-features = false }
